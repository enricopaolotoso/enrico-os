name: Test SiteGround SSH

on:
  push:
    branches:
      - main

jobs:
  test-ssh:
    name: Test SSH connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key

          ssh -vvv \
            -p "${{ secrets.SFTP_PORT }}" \
            -i ~/.ssh/siteground_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}" \
            "pwd && ls -la"