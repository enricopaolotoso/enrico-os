name: Build Astro and deploy to SiteGround

on:
  push:
    branches:
      - main
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  group: enrico-os-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Astro and deploy to SiteGround
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Spotify data
        run: npm run spotify:fetch
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_USER_ID: ${{ secrets.SPOTIFY_USER_ID }}

      - name: Generate LinkedIn data
        run: npm run linkedin:fetch
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}

      - name: Check and build Astro site
        run: |
          npm run check
          node --check public/desktop.js
          php -l scripts/purge-siteground-cache.php
          node --test tests/deployment.test.mjs
          npm run build
          node scripts/verify-seo.mjs

      - name: Check build output
        run: |
          test -d dist || (echo "dist folder missing" && exit 1)
          ls -la dist

      - name: Upload private cache purge helper
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          port: ${{ secrets.SFTP_PORT }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          source: "scripts/purge-siteground-cache.php"
          target: "/home/customer/.enrico-os-deploy"
          strip_components: 1
          overwrite: true

      - name: Deploy dist to SiteGround via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          port: ${{ secrets.SFTP_PORT }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          source: "dist"
          target: ${{ secrets.SFTP_REMOTE_PATH }}
          strip_components: 1
          overwrite: true

      - name: Purge SiteGround Dynamic Cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          port: ${{ secrets.SFTP_PORT }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          script: |
            php "$HOME/.enrico-os-deploy/purge-siteground-cache.php"

      - name: Verify public deployment without bypassing cache
        run: |
          node scripts/verify-deployment.mjs
          node scripts/verify-seo.mjs --live
